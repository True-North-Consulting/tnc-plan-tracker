name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - name: The template keeps its two placeholders
        run: |
          grep -q '{{TITLE}}' skills/plan-tracker/template.html
          grep -q '{{HEADING}}' skills/plan-tracker/template.html
